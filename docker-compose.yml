services:
  redis:
    image: redis:7-alpine
    container_name: proyecto1corte-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: proyecto1corte-rabbitmq
    ports:
      - "5673:5672"
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: proyecto1corte-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    restart: unless-stopped
